<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán đơn hàng - CineForge</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="thanh_toan.css" />
    <link rel="icon" type="image/svg+xml" href="fabicon.svg" />
  </head>
  <body>
    <div class="checkout-container">
      <!-- CỘT TRÁI -->
      <div>
        <!-- Logo Area & Nút Back -->
        <div class="logo-area">
          <a href="./san_pham.html" class="back-btn" title="Quay lại">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </a>
          <span class="logo-text">CF</span>
        </div>

        <div style="margin-bottom: 1.5rem">
          <div class="section-label">Contact</div>
          <input
            type="email"
            id="buyerEmail"
            class="input-field"
            placeholder="Email"
            autocomplete="off"
            required
          />
          <label class="checkbox-container">
            <input type="checkbox" checked />
            Contact me about new announcements
          </label>
        </div>

        <div style="margin-bottom: 1.5rem">
          <div class="section-label" style="margin-bottom: 0.75rem">
            Billing Address
          </div>
          <div
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem"
          >
            <select class="input-field select-custom">
              <option value="VN">Vietnam</option>
              <option value="US">United States</option>
              <option value="UK">United Kingdom</option>
            </select>
            <input
              type="text"
              class="input-field"
              placeholder="Postal code"
              autocomplete="off"
            />
          </div>
        </div>

        <div>
          <div class="section-label" style="margin-bottom: 0.75rem">
            Payment
          </div>

          <div class="payment-box">
            <!-- 1. Thẻ Card -->
            <div
              class="payment-method"
              id="methodCard"
              onclick="switchPayment('card')"
            >
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 0.5rem;
                  font-weight: 500;
                  font-size: 0.95rem;
                "
              >
                💳 Card
              </div>
            </div>
            <div class="payment-option-content show" id="contentCard">
              <div style="position: relative">
                <input
                  type="text"
                  class="input-field card-input-padding"
                  placeholder="Card number"
                  autocomplete="off"
                  readonly
                  onfocus="this.removeAttribute('readonly')"
                />
                <div class="card-brands">
                  <span
                    style="
                      background: #1a1f71;
                      color: #fff;
                      padding: 2px 3px;
                      border-radius: 2px;
                    "
                    >VISA</span
                  >
                  <span
                    style="
                      background: #eb001b;
                      color: #fff;
                      padding: 2px 3px;
                      border-radius: 2px;
                    "
                    >MC</span
                  >
                  <span
                    style="
                      background: #006fcf;
                      color: #fff;
                      padding: 2px 3px;
                      border-radius: 2px;
                    "
                    >AMEX</span
                  >
                  <span
                    style="
                      background: #ff5f00;
                      color: #fff;
                      padding: 2px 3px;
                      border-radius: 2px;
                    "
                    >JCB</span
                  >
                </div>
              </div>
              <div class="card-inputs-grid">
                <input
                  type="text"
                  class="input-field"
                  placeholder="MM / YY"
                  autocomplete="off"
                  readonly
                  onfocus="this.removeAttribute('readonly')"
                />
                <div style="position: relative">
                  <input
                    type="text"
                    class="input-field"
                    placeholder="CVC"
                    autocomplete="off"
                    readonly
                    onfocus="this.removeAttribute('readonly')"
                  />
                  <span class="cvc-icon">🔒</span>
                </div>
              </div>
            </div>

            <!-- 2. PayPal -->
            <div
              class="payment-method"
              id="methodPaypal"
              onclick="switchPayment('paypal')"
            >
              <span style="font-weight: 500; font-size: 0.95rem"
                >🅿️ PayPal</span
              >
            </div>
            <div class="payment-option-content" id="contentPaypal">
              <div class="gateway-info-box">
                <span>🪟</span>
                <span
                  >After submission, you'll be guided through completing next
                  steps with PayPal.</span
                >
              </div>
            </div>

            <!-- 3. Alipay -->
            <div
              class="payment-method"
              id="methodAlipay"
              onclick="switchPayment('alipay')"
            >
              <span style="font-weight: 500; font-size: 0.95rem"
                >💙 Alipay</span
              >
            </div>
            <div class="payment-option-content" id="contentAlipay">
              <div class="gateway-info-box">
                <span>🪟</span>
                <span
                  >After submission, you will be redirected to securely complete
                  next steps.</span
                >
              </div>
            </div>
          </div>
        </div>

        <button
          type="button"
          id="completeOrderBtn"
          onclick="handleCompleteOrder()"
          class="complete-btn"
        >
          Complete order
        </button>
      </div>

      <!-- CỘT PHẢI -->
      <div>
        <div class="summary-card">
          <!-- Vùng chứa danh sách sản phẩm tự động render -->
          <div id="checkoutItemsList">
            <!-- JavaScript sẽ tự động điền danh sách sản phẩm vào đây -->
          </div>

          <div class="summary-row">
            <span id="subtotalItemText">Subtotal (0 items)</span>
            <span id="subtotalVnd">0 đ</span>
          </div>

          <div class="summary-row total">
            <span>Total</span>
            <div style="text-align: right">
              <span id="totalVnd" style="color: #fff; font-size: 1.1rem"
                >0 đ</span
              >
              <div
                id="totalUsd"
                style="font-size: 0.8rem; color: #a1a1aa; font-weight: normal"
              >
                USD $0.00
              </div>
            </div>
          </div>

          <button class="promo-link" type="button">
            <span>Promo code or gift card</span>
            <span>⌵</span>
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
