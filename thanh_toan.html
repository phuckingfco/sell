<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán đơn hàng - CineForge</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="thanh_toan.css" />
    <link rel="icon" type="image/svg+xml" href="fabicon.svg" />
  </head>
  <body>
    <div class="checkout-container">
      <!-- CỘT TRÁI -->
      <div>
        <!-- Logo Area & Nút Back -->
        <div class="logo-area">
          <a href="./san_pham.html" class="back-btn" title="Quay lại">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </a>
          <span class="logo-text"
            ><img
              src="./img/CF_img.svg"
              alt="CF Logo"
              style="width: 48px; height: 48px; border-radius: 12px"
          /></span>
        </div>

        <div style="margin-bottom: 1.5rem">
          <div class="section-label">Contact</div>
          <input
            type="email"
            id="buyerEmail"
            class="input-field"
            placeholder="Email"
            autocomplete="off"
            required
          />
          <label class="checkbox-container">
            <input type="checkbox" checked />
            Contact me about new announcements
          </label>
        </div>

        <div style="margin-bottom: 1.5rem">
          <div class="section-label" style="margin-bottom: 0.75rem">
            Billing Address
          </div>
          <div
            style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem"
          >
            <select class="input-field select-custom">
              <option value="VN">Vietnam</option>
              <option value="US">United States</option>
              <option value="UK">United Kingdom</option>
            </select>
            <input
              type="text"
              class="input-field"
              placeholder="Postal code"
              autocomplete="off"
            />
          </div>
        </div>

        <div>
          <div class="section-label" style="margin-bottom: 0.75rem">
            Payment
          </div>

          <div
            class="payment-methods-container"
            style="display: flex; flex-direction: column; gap: 1rem"
          >
            <!-- Cục 1: Card (Khi chọn sẽ bung form nhập thẻ bên trong) -->
            <div
              class="payment-box"
              id="methodCard"
              onclick="switchPayment('card')"
              style="
                border: 1px solid #27272a;
                border-radius: 1rem;
                padding: 1rem;
                background: #121214;
                cursor: pointer;
                transition: all 0.2s;
              "
            >
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 0.75rem;
                  font-weight: 600;
                  color: #fff;
                "
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                  <line x1="1" y1="10" x2="23" y2="10"></line>
                </svg>
                Card
              </div>
              <div
                id="contentCard"
                class="payment-content"
                style="
                  display: none;
                  margin-top: 1rem;
                  padding-top: 1rem;
                  border-top: 1px solid #27272a;
                "
              >
                <input
                  type="text"
                  class="input-field"
                  placeholder="Card number"
                  autocomplete="off"
                  style="margin-bottom: 0.75rem"
                />
                <div
                  style="
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 0.75rem;
                  "
                >
                  <input
                    type="text"
                    class="input-field"
                    placeholder="MM / YY"
                    autocomplete="off"
                  />
                  <input
                    type="text"
                    class="input-field"
                    placeholder="CVC"
                    autocomplete="off"
                  />
                </div>
              </div>
            </div>

            <!-- Cục 2: PayPal -->
            <div
              class="payment-box"
              id="methodPaypal"
              onclick="switchPayment('paypal')"
              style="
                border: 1px solid #27272a;
                border-radius: 1rem;
                padding: 1rem;
                background: #121214;
                cursor: pointer;
                transition: all 0.2s;
              "
            >
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 0.75rem;
                  font-weight: 600;
                  color: #fff;
                "
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M7 17l9-9M7 8h9v9"></path>
                </svg>
                PayPal
              </div>
              <div
                id="contentPaypal"
                class="payment-content"
                style="
                  display: none;
                  margin-top: 1rem;
                  padding-top: 1rem;
                  border-top: 1px solid #27272a;
                "
              >
                <p style="color: #a1a1aa; font-size: 0.85rem">
                  Thanh toán nhanh chóng và an toàn qua cổng PayPal.
                </p>
              </div>
            </div>

            <!-- Cục 3: Alipay -->
            <div
              class="payment-box"
              id="methodAlipay"
              onclick="switchPayment('alipay')"
              style="
                border: 1px solid #27272a;
                border-radius: 1rem;
                padding: 1rem;
                background: #121214;
                cursor: pointer;
                transition: all 0.2s;
              "
            >
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 0.75rem;
                  font-weight: 600;
                  color: #fff;
                "
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#38bdf8"
                  stroke-width="2"
                >
                  <path d="M4 12h16M12 4v16"></path>
                </svg>
                Alipay
              </div>
              <div
                id="contentAlipay"
                class="payment-content"
                style="
                  display: none;
                  margin-top: 1rem;
                  padding-top: 1rem;
                  border-top: 1px solid #27272a;
                "
              >
                <div
                  style="
                    background: #18181b;
                    border: 1px solid #27272a;
                    border-radius: 0.75rem;
                    padding: 0.75rem;
                    display: flex;
                    align-items: center;
                    gap: 0.75rem;
                  "
                >
                  <span style="font-size: 1.2rem">🪟</span>
                  <span style="color: #a1a1aa; font-size: 0.85rem"
                    >After submission, you will be redirected to securely
                    complete next steps.</span
                  >
                </div>
              </div>
            </div>
          </div>
        </div>

        <button
          type="button"
          id="completeOrderBtn"
          onclick="handleCompleteOrder()"
          class="complete-btn"
        >
          Complete order
        </button>
      </div>

      <!-- CỘT PHẢI -->
      <div>
        <div class="summary-card">
          <!-- Vùng chứa danh sách sản phẩm tự động render -->
          <div id="checkoutItemsList">
            <!-- JavaScript sẽ tự động điền danh sách sản phẩm vào đây -->
          </div>

          <div class="summary-row">
            <span id="subtotalItemText">Subtotal (0 items)</span>
            <span id="subtotalVnd">0 đ</span>
          </div>

          <div class="summary-row total">
            <span>Total</span>
            <div style="text-align: right">
              <span id="totalVnd" style="color: #fff; font-size: 1.1rem"
                >0 đ</span
              >
              <div
                id="totalUsd"
                style="font-size: 0.8rem; color: #a1a1aa; font-weight: normal"
              >
                USD $0.00
              </div>
            </div>
          </div>

          <button class="promo-link" type="button">
            <span>Promo code or gift card</span>
            <span>⌵</span>
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
