<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ Hàng - CineForge</title>
    <link rel="icon" type="image/svg+xml" href="fabicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    style="
      padding: 2rem;
      background-color: #0b0f19;
      color: #fff;
      font-family: &quot;Inter&quot;, sans-serif;
    "
  >
    <div
      style="
        max-width: 800px;
        margin: 0 auto;
        background-color: #121824;
        border: 1px solid #1f2937;
        border-radius: 1.25rem;
        padding: 2rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      "
    >
      <h2 style="color: #ffffff; margin-bottom: 1.5rem; font-size: 1.75rem">
        Giỏ Hàng Của Bạn
      </h2>

      <div id="cartItemsContainer" style="margin-bottom: 2rem; color: #94a3b8">
        <!-- Danh sách sản phẩm sẽ được load tự động bằng JS -->
      </div>

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-top: 1px solid #1f2937;
          padding-top: 1rem;
          margin-bottom: 1.5rem;
        "
      >
        <span style="font-size: 1.2rem; font-weight: 700; color: #ffffff"
          >Tổng thanh toán:</span
        >
        <span
          id="cartTotalPrice"
          style="font-size: 1.5rem; font-weight: 900; color: #38bdf8"
          >0đ</span
        >
      </div>

      <div
        class="cart-actions"
        style="display: flex; flex-direction: column; gap: 0.75rem"
      >
        <!-- Đã sửa nút này thành thẻ a trỏ thẳng sang trang thanh_toan.html -->
        <a
          href="thanh_toan.html"
          style="
            display: block;
            width: 100%;
            padding: 1rem;
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            border-radius: 0.75rem;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            cursor: pointer;
          "
        >
          Thanh toán ngay
        </a>

        <!-- Nút Quay lại mua sắm -->
        <a
          href="san_pham.html"
          style="
            display: block;
            text-align: center;
            padding: 0.75rem;
            background: #1f2937;
            color: #fff;
            text-decoration: none;
            border-radius: 0.75rem;
            font-weight: 500;
            font-size: 0.95rem;
            border: 1px solid #374151;
            box-sizing: border-box;
          "
        >
          ← Quay lại mua sắm
        </a>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      // Hàm hiển thị danh sách sản phẩm trong giỏ hàng
      function renderCartPage() {
        const cart = getCart();
        const container = document.getElementById("cartItemsContainer");
        const totalPriceEl = document.getElementById("cartTotalPrice");

        if (!container) return;

        // Xử lý khi giỏ hàng trống
        if (cart.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 1rem 0;">
              <p style="color: #94a3b8; text-align: center; font-size: 1rem;">Giỏ hàng của bạn đang trống!</p>
            </div>
          `;
          if (totalPriceEl) totalPriceEl.textContent = "0đ";
          return;
        }

        // Nếu giỏ hàng có sản phẩm (hiển thị danh sách)
        let html = "";
        let totalAmount = 0;

        cart.forEach((item, index) => {
          const itemTotal = item.price * (item.quantity || 1);
          totalAmount += itemTotal;
          html += `
            <div style="display: flex; justify-content: space-between; align-items: center; background: #0b0f19; padding: 1rem; border-radius: 0.5rem; margin-bottom: 0.75rem; border: 1px solid #374151;">
              <div>
                <h4 style="color: #fff; margin-bottom: 0.25rem;">${item.name}</h4>
                <p style="color: #38bdf8; font-size: 0.9rem;">${item.price.toLocaleString()}đ x ${item.quantity || 1}</p>
              </div>
              <button onclick="removeItem(${index})" style="background: #ef4444; color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 0.3rem; cursor: pointer; font-size: 0.85rem;">Xóa</button>
            </div>
          `;
        });

        container.innerHTML = html;
        if (totalPriceEl)
          totalPriceEl.textContent = totalAmount.toLocaleString() + "đ";
      }

      // Hàm xóa từng sản phẩm trong giỏ
      function removeItem(index) {
        let cart = getCart();
        cart.splice(index, 1);
        saveCart(cart);
        renderCartPage();
      }

      // Tự động chạy khi tải trang giỏ hàng
      document.addEventListener("DOMContentLoaded", () => {
        renderCartPage();
      });
    </script>
  </body>
</html>
