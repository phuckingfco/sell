<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản - CINEFORGE</title>
    <!-- Link Google Fonts & CSS tương tự các trang khác của Phúc -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body {
        background-color: #0b0f19;
        color: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .auth-container {
        background-color: #111827;
        padding: 2.5rem;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
        max-width: 420px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }
      .auth-container h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        font-size: 1.8rem;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .input-group {
        margin-bottom: 1.2rem;
      }
      .input-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
        color: #9ca3af;
      }
      .input-group input {
        width: 100%;
        padding: 0.75rem 1rem;
        background-color: #1f2937;
        border: 1px solid #374151;
        border-radius: 0.5rem;
        color: white;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.3s;
      }
      .input-group input:focus {
        border-color: #6366f1;
      }
      .btn-submit {
        width: 100%;
        padding: 0.75rem;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        border: none;
        border-radius: 0.5rem;
        color: white;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: opacity 0.3s;
        margin-top: 0.5rem;
      }
      .btn-submit:hover {
        opacity: 0.9;
      }
      .auth-switch {
        text-align: center;
        margin-top: 1.2rem;
        color: #9ca3af;
        font-size: 0.9rem;
      }
      .auth-switch a {
        color: #6366f1;
        text-decoration: none;
        font-weight: 500;
      }
      .auth-switch a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <h2>Đăng Ký CINEFORGE</h2>
      <form action="#" method="POST">
        <div class="input-group">
          <label>Họ và tên</label>
          <input type="text" placeholder="Nhập họ tên của bạn..." required />
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" placeholder="Nhập email của bạn..." required />
        </div>
        <div class="input-group">
          <label>Mật khẩu</label>
          <input type="password" placeholder="Tạo mật khẩu mới..." required />
        </div>
        <div class="input-group">
          <label>Xác nhận mật khẩu</label>
          <input type="password" placeholder="Nhập lại mật khẩu..." required />
        </div>

        <button type="submit" class="btn-submit">Đăng ký tài khoản</button>

        <div class="auth-switch">
          Đã có tài khoản? <a href="dang_nhap.html">Đăng nhập ngay</a>
        </div>
      </form>
    </div>
  </body>
</html>
