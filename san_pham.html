<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm - CineForge</title>
    <link rel="icon" type="image/svg+xml" href="fabicon.svg" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Poppins:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- File CSS chung -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation Bar -->
    <header>
      <div class="nav-container">
        <div class="logo">CINEFORGE</div>
        <ul class="nav-links">
          <li><a href="danh_muc.html">Danh mục</a></li>
          <li><a href="san_pham.html">Sản phẩm Hot</a></li>
          <li><a href="free.html">Miễn phí (Freebies)</a></li>
          <li><a href="help.html">Hướng dẫn</a></li>
        </ul>
        <div class="nav-actions">
          <a href="login.html" class="login-btn">Đăng nhập</a>
          <a href="gio_hang.html" class="cart-btn">Giỏ hàng (0)</a>
        </div>
      </div>
    </header>

    <!-- Product Detail Section -->
    <div
      class="product-detail-container"
      style="
        max-width: 900px;
        margin: 3rem auto;
        padding: 0 1rem;
        display: flex;
        flex-direction: column;
        gap: 3rem;
      "
    >
      <!-- SẢN PHẨM 1 -->
      <div
        style="
          background: #121824;
          border: 1px solid var(--border-color, #1f2937);
          border-radius: 1.25rem;
          padding: 2.5rem;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
          margin-bottom: 2rem;
        "
      >
        <span
          class="hero-badge"
          style="
            margin-bottom: 1rem;
            display: inline-block;
            font-size: 0.85rem;
            color: #38bdf8;
          "
          >DaVinci Resolve Studio</span
        >

        <h2
          style="
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.75rem;
            color: #fff;
          "
        >
          Video DEMO 1
        </h2>
        <p style="color: #94a3b8; font-size: 1rem; margin-bottom: 1.5rem">
          Mô tả sản phẩm
        </p>

        <!-- Khung Video TO (Tỉ lệ 16:9) -->
        <div
          style="
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #0b0f19;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--border-color, #1f2937);
            margin-bottom: 2rem;
          "
        >
          <video
            muted
            loop
            playsinline
            preload="metadata"
            onmouseover="this.play()"
            onmouseout="this.pause()"
            oncontextmenu="return false;"
            style="width: 100%; height: 100%; object-fit: cover"
          >
            <source src="./videos/video_demo.mp4" type="video/mp4" />
            Trình duyệt của bạn không hỗ trợ thẻ video.
          </video>
        </div>

        <!-- Giá và Nút bấm -->
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
          "
        >
          <div style="font-size: 1.8rem; font-weight: bold; color: #38bdf8">
            15.000đ
          </div>

          <div style="display: flex; gap: 1rem; min-width: 320px">
            <button
              onclick="addToCartCustom(this)"
              data-name="VIDEO DEMO 1"
              data-file="./videos/video_demo.mp4"
              data-price="15000"
              style="
                flex: 1;
                padding: 0.85rem 1.5rem;
                text-align: center;
                background: #3b82f6;
                color: white;
                border: none;
                border-radius: 0.75rem;
                font-weight: bold;
                cursor: pointer;
                font-size: 1rem;
              "
            >
              Thêm giỏ hàng
            </button>
            <button
              onclick="buyNowDirect(this)"
              data-name="VIDEO DEMO 1"
              data-file="./videos/video_demo.mp4"
              data-price="15000"
              style="
                flex: 1;
                padding: 0.85rem 1.5rem;
                text-align: center;
                background: linear-gradient(135deg, #a855f7, #3b82f6);
                color: white;
                border: none;
                border-radius: 0.75rem;
                font-weight: bold;
                cursor: pointer;
                font-size: 1rem;
              "
            >
              Mua ngay
            </button>
          </div>
        </div>
      </div>

      <!-- SẢN PHẨM 2 -->
      <div
        style="
          background: #121824;
          border: 1px solid var(--border-color, #1f2937);
          border-radius: 1.25rem;
          padding: 2.5rem;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        "
      >
        <span
          class="hero-badge"
          style="
            margin-bottom: 1rem;
            display: inline-block;
            font-size: 0.85rem;
            color: #38bdf8;
          "
          >DaVinci Resolve Studio</span
        >

        <h2
          style="
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.75rem;
            color: #fff;
          "
        >
          Video DEMO 2
        </h2>
        <p style="color: #94a3b8; font-size: 1rem; margin-bottom: 1.5rem">
          Mô tả sản phẩm.
        </p>

        <!-- Khung Video DỌC (Tỉ lệ 9:16) -->
        <div
          style="
            position: relative;
            width: 100%;
            max-width: 320px;
            margin: 0 auto 2rem auto;
            aspect-ratio: 9/16;
            background-color: #0b0f19;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid var(--border-color, #1f2937);
          "
        >
          <video
            muted
            loop
            playsinline
            preload="metadata"
            onmouseover="this.play()"
            onmouseout="this.pause()"
            oncontextmenu="return false;"
            style="width: 100%; height: 100%; object-fit: cover"
          >
            <source src="./videos/Main.mp4" type="video/mp4" />
            Trình duyệt của bạn không hỗ trợ thẻ video.
          </video>
        </div>

        <!-- Giá và Nút bấm -->
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
          "
        >
          <div style="font-size: 1.8rem; font-weight: bold; color: #38bdf8">
            25.000đ
          </div>

          <div style="display: flex; gap: 1rem; min-width: 320px">
            <button
              onclick="addToCartCustom(this)"
              data-name="VIDEO DEMO 2"
              data-file="./videos/Main.mp4"
              data-price="25000"
              style="
                flex: 1;
                padding: 0.85rem 1.5rem;
                text-align: center;
                background: #3b82f6;
                color: white;
                border: none;
                border-radius: 0.75rem;
                font-weight: bold;
                cursor: pointer;
                font-size: 1rem;
              "
            >
              Thêm giỏ hàng
            </button>
            <button
              onclick="buyNowDirect(this)"
              data-name="VIDEO DEMO 2"
              data-file="./videos/Main.mp4"
              data-price="25000"
              style="
                flex: 1;
                padding: 0.85rem 1.5rem;
                text-align: center;
                background: linear-gradient(135deg, #a855f7, #3b82f6);
                color: white;
                border: none;
                border-radius: 0.75rem;
                font-weight: bold;
                cursor: pointer;
                font-size: 1rem;
              "
            >
              Mua ngay
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Đưa Script ra ngoài cùng đặt ở đây để chạy chuẩn -->
    <script src="script.js"></script>
  </body>
</html>
